<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin - Desa Matang Labong</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
        body { background: #f0f4f1; color: #294333; padding: 15px; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; }
        .container { width: 100%; max-width: 600px; background: #ffffff; padding: 20px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); margin-top: 10px; }
        h2 { color: #1f5c3a; font-size: 20px; margin-bottom: 15px; text-align: center; }
        
        .login-box { background: #e8f5eb; padding: 20px; border-radius: 16px; text-align: center; }
        input[type="password"], input[type="text"], select, textarea { width: 100%; padding: 10px 12px; border: 2px solid #dce9df; border-radius: 10px; font-size: 14px; margin-top: 8px; outline: none; }
        textarea { height: 70px; resize: vertical; }
        
        .btn { width: 100%; padding: 12px; background-color: #28734b; color: white; border: none; border-radius: 10px; font-weight: bold; font-size: 14px; cursor: pointer; margin-top: 10px; }
        .btn:disabled { background-color: #a5c4b1; }
        
        .card { background: #f9fbf9; border: 1px solid #dce9df; padding: 15px; border-radius: 14px; margin-bottom: 15px; }
        .card-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px dashed #ccc; padding-bottom: 8px; margin-bottom: 8px; }
        .token-tag { background: #1f5c3a; color: white; padding: 3px 8px; border-radius: 6px; font-size: 12px; font-weight: bold; }
        .status-badge { font-size: 12px; font-weight: bold; color: #d68910; }
        .status-done { color: #27ae60; }
        
        .pesan-text { background: #ffffff; border-left: 3px solid #28734b; padding: 8px; font-size: 13px; margin: 8px 0; }
        .reply-box { margin-top: 10px; background: #edf7f0; padding: 10px; border-radius: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h2>🛠️ Panel Admin Tanggapan</h2>

    <!-- FORM LOGIN ADMIN -->
    <div id="loginSection" class="login-box">
        <h3>Masukan Sandi Admin</h3>
        <input type="password" id="passInput" placeholder="Sandi Admin">
        <button class="btn" onclick="loginAdmin()">Masuk Panel</button>
        <p id="loginError" style="color: red; font-size: 12px; margin-top: 8px;"></p>
    </div>

    <!-- DAFTAR PESAN (Hanya muncul setelah login) -->
    <div id="adminPanel" style="display: none;">
        <button class="btn" onclick="loadPesan()" style="margin-bottom: 15px; background: #1f5c3a;">🔄 Segarkan Data</button>
        <div id="pesanContainer">Memuat data...</div>
    </div>
</div>

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbwhUWmqbiA07mkMWwzRBU9E40K6rUFw1mEw_3DgbCZPMTLJZc-dUF6RmqlfszNzCNIZ/exec';
    const PASS_ADMIN = "desa123"; // Password sudah diganti jadi desa123

    function loginAdmin() {
        const pass = document.getElementById('passInput').value;
        if (pass === PASS_ADMIN) {
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('adminPanel').style.display = 'block';
            loadPesan();
        } else {
            document.getElementById('loginError').innerText = "Password salah!";
        }
    }

    function loadPesan() {
        const container = document.getElementById('pesanContainer');
        container.innerHTML = "Memuat daftar pesan...";

        const formData = new FormData();
        formData.append('action', 'getAllData');

        fetch(scriptURL, { method: 'POST', body: formData })
            .then(res => res.json())
            .then(data => {
                if(data.result === 'success') {
                    if(data.data.length === 0) {
                        container.innerHTML = "<p style='text-align:center;'>Belum ada pesan masuk.</p>";
                        return;
                    }
                    let html = '';
                    data.data.forEach((item, index) => {
                        const isDone = item.status === 'Selesai';
                        html += `
                            <div class="card">
                                <div class="card-header">
                                    <span class="token-tag">${item.token || 'TANPA TOKEN'}</span>
                                    <span class="status-badge ${isDone ? 'status-done' : ''}">${item.status || 'Pending'}</span>
                                </div>
                                <p><strong>Nama:</strong> ${item.nama} (${item.dusun})</p>
                                <p><strong>WA:</strong> <a href="https://wa.me/${item.wa}" target="_blank">${item.wa}</a></p>
                                <div class="pesan-text"><strong>Pesan:</strong> ${item.pesan}</div>
                                
                                <div class="reply-box">
                                    <label><strong>Tanggapi Pesan Ini:</strong></label>
                                    <select id="status_${index}">
                                        <option value="Diproses" ${item.status === 'Diproses' ? 'selected' : ''}>Diproses</option>
                                        <option value="Selesai" ${item.status === 'Selesai' ? 'selected' : ''}>Selesai</option>
                                    </select>
                                    <textarea id="reply_${index}" placeholder="Tuliskan jawaban dari admin...">${item.tanggapan || ''}</textarea>
                                    <button class="btn" id="btn_${index}" onclick="kirimBalasan('${item.token}', ${index})">💾 Simpan Tanggapan</button>
                                </div>
                            </div>
                        `;
                    });
                    container.innerHTML = html;
                } else {
                    container.innerHTML = "Gagal mengambil data.";
                }
            })
            .catch(err => {
                container.innerHTML = "Terjadi kesalahan koneksi.";
            });
    }

    function kirimBalasan(token, index) {
        const statusVal = document.getElementById(`status_${index}`).value;
        const replyVal = document.getElementById(`reply_${index}`).value;
        const btn = document.getElementById(`btn_${index}`);

        if (!replyVal.trim()) {
            alert('Tanggapan tidak boleh kosong!');
            return;
        }

        btn.disabled = true;
        btn.innerText = '⏳ Menyimpan...';

        const formData = new FormData();
        formData.append('action', 'updateTanggapan');
        formData.append('token', token);
        formData.append('status', statusVal);
        formData.append('tanggapan', replyVal);

        fetch(scriptURL, { method: 'POST', body: formData })
            .then(res => res.json())
            .then(data => {
                btn.disabled = false;
                btn.innerText = '💾 Simpan Tanggapan';
                if(data.result === 'success') {
                    alert('✅ Tanggapan berhasil dikirim dan tersimpan!');
                    loadPesan();
                } else {
                    alert('❌ Gagal: ' + data.message);
                }
            })
            .catch(err => {
                btn.disabled = false;
                btn.innerText = '💾 Simpan Tanggapan';
                alert('❌ Terjadi kesalahan jaringan.');
            });
    }
</script>

</body>
</html>
