<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin Desa</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f7f6;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            position: relative;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 20px;
            gap: 10px;
            padding-right: 40px;
        }
        h2 {
            color: #2c3e50;
        }
        .btn-close {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #e74c3c;
            color: white;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
        }
        .btn-close:hover {
            background: #c0392b;
        }
        .actions {
            display: flex;
            gap: 10px;
            width: 100%;
            max-width: 400px;
        }
        input[type="text"] {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            outline: none;
        }
        .btn-refresh {
            padding: 10px 16px;
            background-color: #2980b9;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-refresh:hover {
            background-color: #1f618d;
        }
        .table-wrapper {
            overflow-x: auto;
            margin-top: 15px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.95em;
        }
        th, td {
            padding: 12px 15px;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #34495e;
            color: white;
            white-space: nowrap;
        }
        tr:hover {
            background-color: #f1f1f1;
        }
        .loading {
            text-align: center;
            padding: 20px;
            font-weight: bold;
            color: #7f8c8d;
        }
        .wa-link {
            color: #27ae60;
            text-decoration: none;
            font-weight: bold;
        }
        .wa-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="container" id="adminContainer" style="display: none;">
    <a href="index.html" class="btn-close" title="Kembali ke Beranda">✕</a>

    <div class="header">
        <h2>Dashboard Layanan Warga</h2>
        <div class="actions">
            <input type="text" id="searchInput" onkeyup="filterTable()" placeholder="Cari nama warga...">
            <button class="btn-refresh" onclick="loadData()">Refresh Data</button>
        </div>
    </div>

    <div class="table-wrapper">
        <table id="dataTable">
            <thead>
                <tr>
                    <th>Waktu</th>
                    <th>Nama Lengkap</th>
                    <th>Nomor WA</th>
                    <th>Dusun / RT</th>
                    <th>Keperluan / Pesan</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <tr>
                    <td colspan="5" class="loading">Memuat data dari Google Sheets...</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    // --- PENGATURAN KATA SANDI ---
    // Ganti 'admin123' di bawah ini dengan kata sandi rahasia Anda sendiri
    const PASSWORD_ADMIN = 'admin123'; 

    function checkAuth() {
        let inputPass = prompt("Masukkan Kata Sandi Admin:");
        if (inputPass === PASSWORD_ADMIN) {
            document.getElementById('adminContainer').style.display = 'block';
            loadData();
        } else {
            alert("Kata sandi salah! Anda akan dikembalikan ke halaman utama.");
            window.location.href = "index.html";
        }
    }

    const scriptURL = 'https://script.google.com/macros/s/AKfycbzINn-UFss3UnA714uE-RhbbskQhBJ34NL_sDKQ2ACo3-N7PtWG6-aaYitiVU0Jh_voqw/exec';

    function loadData() {
        const tableBody = document.getElementById('tableBody');
        tableBody.innerHTML = '<tr><td colspan="5" class="loading">Memuat data terbaru...</td></tr>';

        fetch(scriptURL)
            .then(res => res.json())
            .then(data => {
                if (!data || data.length === 0) {
                    tableBody.innerHTML = '<tr><td colspan="5" class="loading">Belum ada data masuk.</td></tr>';
                    return;
                }

                tableBody.innerHTML = '';

                for (let i = 0; i < data.length; i++) {
                    const row = data[i];
                    if (!row || row.length === 0 || !row[1]) continue;

                    const isHeader = row[0].toString().toLowerCase().includes('timestamp') || 
                                     row[0].toString().toLowerCase().includes('waktu') ||
                                     row[1].toString().toLowerCase().includes('nama');
                    if (isHeader) continue;

                    const tr = document.createElement('tr');

                    let parsedDate = new Date(row[0]);
                    let tanggal = !isNaN(parsedDate.getTime()) 
                        ? parsedDate.toLocaleString('id-ID') 
                        : row[0];

                    let nama = row[1] || '-';
                    let wa = row[2] || '-';
                    let dusun = row[3] || '-';
                    let pesan = row[4] || '-';

                    let waFormatted = wa.toString().replace(/[^0-9]/g, '');
                    if (waFormatted.startsWith('0')) {
                        waFormatted = '62' + waFormatted.substring(1);
                    }
                    let waDisplay = wa !== '-' ? `<a class="wa-link" href="https://wa.me/${waFormatted}" target="_blank">${wa} 💬</a>` : '-';

                    tr.innerHTML = `
                        <td>${tanggal}</td>
                        <td><strong>${nama}</strong></td>
                        <td>${waDisplay}</td>
                        <td>${dusun}</td>
                        <td>${pesan}</td>
                    `;

                    tableBody.appendChild(tr);
                }

                if (tableBody.children.length === 0) {
                    tableBody.innerHTML = '<tr><td colspan="5" class="loading">Belum ada data warga yang tersimpan.</td></tr>';
                }
            })
            .catch(error => {
                console.error('Error fetching data:', error);
                tableBody.innerHTML = '<tr><td colspan="5" class="loading" style="color:red;">Gagal mengambil data. Pastikan jaringan aman.</td></tr>';
            });
    }

    function filterTable() {
        const input = document.getElementById("searchInput");
        const filter = input.value.toLowerCase();
        const table = document.getElementById("dataTable");
        const tr = table.getElementsByTagName("tr");

        for (let i = 1; i < tr.length; i++) {
            let tdNama = tr[i].getElementsByTagName("td")[1];
            if (tdNama) {
                let textValue = tdNama.textContent || tdNama.innerText;
                if (textValue.toLowerCase().indexOf(filter) > -1) {
                    tr[i].style.display = "";
                } else {
                    tr[i].style.display = "none";
                }
            }
        }
    }

    // Jalankan pemeriksaan kata sandi saat halaman dibuka
    window.onload = checkAuth;
</script>

</body>
</html>
