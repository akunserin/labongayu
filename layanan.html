<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulir Layanan Desa</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f7f6;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 500px;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            position: relative;
        }
        .btn-close {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #e74c3c;
            color: white;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
        }
        .btn-close:hover {
            background: #c0392b;
        }
        h2 {
            color: #2c3e50;
            margin-bottom: 20px;
            text-align: center;
            padding-right: 30px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            color: #333;
            font-weight: 600;
        }
        input[type="text"],
        input[type="tel"],
        textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
        }
        input:focus, textarea:focus {
            border-color: #27ae60;
        }
        textarea {
            resize: vertical;
            height: 100px;
        }
        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: #27ae60;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn-submit:hover {
            background-color: #219150;
        }
        .btn-submit:disabled {
            background-color: #95a5a6;
            cursor: not-allowed;
        }
        #statusMessage {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <a href="index.html" class="btn-close" title="Kembali ke Beranda">✕</a>
    
    <h2>Formulir Layanan Desa</h2>

    <form id="layananForm">
        <div class="form-group">
            <label for="nama">Nama Lengkap</label>
            <input type="text" id="nama" name="Nama Lengkap" placeholder="Masukkan nama lengkap" required>
        </div>

        <div class="form-group">
            <label for="wa">Nomor WhatsApp</label>
            <input type="tel" id="wa" name="Nomor WA" placeholder="Contoh: 081234567890" required>
        </div>

        <div class="form-group">
            <label for="dusun">Dusun / RT / RW</label>
            <input type="text" id="dusun" name="Dusun / RT" placeholder="Contoh: Dusun II / RT 03" required>
        </div>

        <div class="form-group">
            <label for="pesan">Keperluan / Pesan</label>
            <textarea id="pesan" name="Keperluan / Pesan" placeholder="Tuliskan keperluan atau pesan Anda..." required></textarea>
        </div>

        <button type="submit" class="btn-submit" id="btnSubmit">Kirim Pesan</button>
    </form>

    <div id="statusMessage"></div>
</div>

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbzINn-UFss3UnA714uE-RhbbskQhBJ34NL_sDKQ2ACo3-N7PtWG6-aaYitiVU0Jh_voqw/exec';
    const form = document.getElementById('layananForm');
    const btnSubmit = document.getElementById('btnSubmit');
    const statusMessage = document.getElementById('statusMessage');

    form.addEventListener('submit', e => {
        e.preventDefault();
        btnSubmit.disabled = true;
        btnSubmit.innerText = 'Mengirim...';
        statusMessage.style.color = '#2980b9';
        statusMessage.innerText = 'Proses mengirim pesan...';

        fetch(scriptURL, { method: 'POST', body: new FormData(form) })
            .then(response => {
                btnSubmit.disabled = false;
                btnSubmit.innerText = 'Kirim Pesan';
                statusMessage.style.color = '#27ae60';
                statusMessage.innerText = 'Pesan berhasil dikirim!';
                form.reset();
            })
            .catch(error => {
                btnSubmit.disabled = false;
                btnSubmit.innerText = 'Kirim Pesan';
                statusMessage.style.color = '#e74c3c';
                statusMessage.innerText = 'Gagal mengirim pesan. Coba lagi.';
                console.error('Error!', error.message);
            });
    });
</script>

</body>
</html>
