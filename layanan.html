<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layanan Surat & Aspirasi Desa</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f7f6;
            color: #333;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }
        h2 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 8px;
        }
        p.subtitle {
            text-align: center;
            color: #7f8c8d;
            font-size: 0.9em;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #34495e;
            font-size: 0.95em;
        }
        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 1em;
            outline: none;
            transition: border-color 0.3s;
        }
        input:focus, select:focus, textarea:focus {
            border-color: #27ae60;
        }
        button {
            width: 100%;
            padding: 14px;
            background-color: #27ae60;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.05em;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #219150;
        }
        button:disabled {
            background-color: #95a5a6;
            cursor: not-allowed;
        }
        .alert {
            display: none;
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
            font-size: 0.9em;
        }
        .alert-success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .alert-danger {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Formulir Layanan Desa</h2>
    <p class="subtitle">Isi data di bawah ini untuk mengajukan permohonan atau pengaduan.</p>

    <div id="alertBox" class="alert"></div>

    <form id="formLayanan">
        <div class="form-group">
            <label for="nama">Nama Lengkap</label>
            <input type="text" id="nama" name="Nama Lengkap" placeholder="Masukkan nama lengkap" required>
        </div>

        <div class="form-group">
            <label for="wa">Nomor WhatsApp</label>
            <input type="tel" id="wa" name="Nomor WA" placeholder="Contoh: 08123456789" required>
        </div>

        <div class="form-group">
            <label for="dusun">Dusun / RT / RW</label>
            <input type="text" id="dusun" name="Dusun / RT" placeholder="Contoh: Dusun Mawar RT 02/01" required>
        </div>

        <div class="form-group">
            <label for="pesan">Keperluan / Pesan</label>
            <textarea id="pesan" name="Keperluan / Pesan" rows="4" placeholder="Tuliskan keperluan surat atau pesan aspirasi Anda..." required></textarea>
        </div>

        <button type="submit" id="btnSubmit">Kirim Permohonan</button>
    </form>
</div>

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbzINn-UFss3UnA714uE-RhbbskQhBJ34NL_sDKQ2ACo3-N7PtWG6-aaYitiVU0Jh_voqw/exec';
    const form = document.getElementById('formLayanan');
    const btnSubmit = document.getElementById('btnSubmit');
    const alertBox = document.getElementById('alertBox');

    form.addEventListener('submit', e => {
        e.preventDefault();
        
        btnSubmit.disabled = true;
        btnSubmit.innerText = "Mengirim...";
        alertBox.style.display = 'none';

        fetch(scriptURL, { method: 'POST', body: new FormData(form) })
            .then(response => response.json())
            .then(data => {
                btnSubmit.disabled = false;
                btnSubmit.innerText = "Kirim Permohonan";
                
                alertBox.className = 'alert alert-success';
                alertBox.innerText = 'Tersimpan! Permohonan Anda telah masuk ke sistem desa.';
                alertBox.style.display = 'block';
                
                form.reset();
            })
            .catch(error => {
                btnSubmit.disabled = false;
                btnSubmit.innerText = "Kirim Permohonan";
                
                alertBox.className = 'alert alert-danger';
                alertBox.innerText = 'Gagal mengirim data! Silakan coba lagi.';
                alertBox.style.display = 'block';
                console.error('Error!', error.message);
            });
    });
</script>

</body>
</html>
