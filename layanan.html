<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layanan & Cek Status - Desa Matang Labong</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
        body { background: linear-gradient(135deg, #e8f5eb, #d4ead9); color: #294333; padding: 15px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { width: 100%; max-width: 480px; background: #ffffff; padding: 25px; border-radius: 24px; box-shadow: 0 10px 35px rgba(31, 92, 58, 0.15); position: relative; }
        .btn-close { position: absolute; top: 20px; right: 20px; background: #28734b; color: white; border: none; width: 36px; height: 36px; border-radius: 50%; font-size: 22px; font-weight: bold; text-decoration: none; display: flex; align-items: center; justify-content: center; }
        .header { text-align: center; margin-bottom: 20px; padding-right: 20px; }
        .header-icon { width: 60px; height: 60px; background: #e2f1e5; border-radius: 20px; display: flex; align-items: center; justify-content: center; font-size: 30px; margin: 0 auto 10px; }
        h2 { color: #1f5c3a; font-size: 22px; margin-bottom: 4px; }
        p.subtitle { color: #718078; font-size: 13px; }
        
        /* TAB MENU */
        .tab-box { display: flex; background: #e8f5eb; border-radius: 12px; padding: 4px; margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 10px; border: none; background: transparent; color: #28734b; font-weight: bold; font-size: 13px; border-radius: 10px; cursor: pointer; }
        .tab-btn.active { background: #28734b; color: white; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        .form-group { margin-bottom: 16px; }
        label { display: block; margin-bottom: 6px; color: #365541; font-weight: 600; font-size: 14px; }
        input[type="text"], input[type="tel"], textarea { width: 100%; padding: 12px 14px; border: 2px solid #dce9df; border-radius: 12px; font-size: 14px; outline: none; }
        input:focus, textarea:focus { border-color: #28734b; }
        textarea { resize: vertical; height: 100px; }
        .btn-submit { width: 100%; padding: 14px; background-color: #28734b; color: white; border: none; border-radius: 12px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 8px; }
        .btn-submit:disabled { background-color: #a5c4b1; }
        
        #statusMessage, #cekResult { margin-top: 15px; font-size: 14px; line-height: 1.5; }
        .card-result { background: #f4faf6; border: 2px dashed #28734b; padding: 15px; border-radius: 12px; margin-top: 15px; }
        .badge { display: inline-block; padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: bold; background: #e2f1e5; color: #1f5c3a; margin-bottom: 8px; }
    </style>
</head>
<body>

<div class="container">
    <a href="index.html" class="btn-close" title="Kembali">×</a>
    
    <div class="header">
        <div class="header-icon">🌿</div>
        <h2>Layanan Desa Matang Labong</h2>
        <p class="subtitle">Kirim Aduan & Cek Tanggapan Admin</p>
    </div>

    <!-- Pilihan Tab Menyatu -->
    <div class="tab-box">
        <button class="tab-btn active" onclick="switchTab('kirim')">📤 Kirim Pesan</button>
        <button class="tab-btn" onclick="switchTab('cek')">🔍 Cek Tanggapan Admin</button>
    </div>

    <!-- TAB 1: FORM KIRIM ADUAN -->
    <div id="tabKirim" class="tab-content active">
        <form id="layananForm">
            <div class="form-group">
                <label for="nama">Nama Lengkap</label>
                <input type="text" id="nama" name="Nama Lengkap" placeholder="Masukkan nama lengkap" required>
            </div>
            <div class="form-group">
                <label for="wa">Nomor WhatsApp</label>
                <input type="tel" id="wa" name="Nomor WA" placeholder="Contoh: 081234567890" required>
            </div>
            <div class="form-group">
                <label for="dusun">Dusun / RT / RW</label>
                <input type="text" id="dusun" name="Dusun / RT" placeholder="Contoh: Dusun II / RT 03" required>
            </div>
            <div class="form-group">
                <label for="pesan">Keperluan / Pesan</label>
                <textarea id="pesan" name="Keperluan / Pesan" placeholder="Tuliskan pesan Anda..." required></textarea>
            </div>
            <button type="submit" class="btn-submit" id="btnSubmit">📤 Kirim Pesan</button>
        </form>
        <div id="statusMessage"></div>
    </div>

    <!-- TAB 2: CEK STATUS TOKEN & BALASAN ADMIN -->
    <div id="tabCek" class="tab-content">
        <div class="form-group">
            <label for="tokenInput">Masukkan Kode Token Anda</label>
            <input type="text" id="tokenInput" placeholder="Contoh: MLB-4829" style="text-transform: uppercase;">
        </div>
        <button type="button" class="btn-submit" id="btnCek" onclick="cekStatusToken()">🔍 Cari Tanggapan</button>
        <div id="cekResult"></div>
    </div>
</div>

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbxqBJxCY0Od8ETtdL1KLcdFqNxzTdwUzlGSFncuSNNmmz06zKsX2poie1eV4hRmXmvV/exec';

    function switchTab(tabName) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

        if (tabName === 'kirim') {
            document.querySelectorAll('.tab-btn')[0].classList.add('active');
            document.getElementById('tabKirim').classList.add('active');
        } else {
            document.querySelectorAll('.tab-btn')[1].classList.add('active');
            document.getElementById('tabCek').classList.add('active');
        }
    }

    // Kirim Pesan
    const form = document.getElementById('layananForm');
    const btnSubmit = document.getElementById('btnSubmit');
    const statusMessage = document.getElementById('statusMessage');

    form.addEventListener('submit', e => {
        e.preventDefault();
        btnSubmit.disabled = true;
        btnSubmit.innerText = '⏳ Mengirim...';
        statusMessage.style.color = '#28734b';
        statusMessage.innerText = 'Proses mengirim pesan...';

        fetch(scriptURL, { method: 'POST', body: new FormData(form) })
            .then(res => res.json())
            .then(data => {
                btnSubmit.disabled = false;
                btnSubmit.innerText = '📤 Kirim Pesan';
                if(data.result === 'success') {
                    statusMessage.style.color = '#27ae60';
                    statusMessage.innerHTML = '✅ Pesan berhasil dikirim!<br><strong>Simpan Token Anda: <span style="color:#1f5c3a; font-size:16px;">' + data.token + '</span></strong>';
                    form.reset();
                } else {
                    statusMessage.style.color = '#d64545';
                    statusMessage.innerText = '❌ Gagal: ' + data.message;
                }
            })
            .catch(error => {
                btnSubmit.disabled = false;
                btnSubmit.innerText = '📤 Kirim Pesan';
                statusMessage.style.color = '#d64545';
                statusMessage.innerText = '❌ Gagal mengirim pesan. Coba lagi.';
            });
    });

    // Cek Balasan Admin Pakai Token
    function cekStatusToken() {
        const tokenVal = document.getElementById('tokenInput').value.trim();
        const btnCek = document.getElementById('btnCek');
        const cekResult = document.getElementById('cekResult');

        if (!tokenVal) {
            cekResult.innerHTML = '<span style="color:#d64545;">Mohon masukkan kode token!</span>';
            return;
        }

        btnCek.disabled = true;
        btnCek.innerText = '⏳ Memeriksa...';
        cekResult.innerHTML = 'Mencari data token...';

        const formData = new FormData();
        formData.append('action', 'cekStatus');
        formData.append('token', tokenVal);

        fetch(scriptURL, { method: 'POST', body: formData })
            .then(res => res.json())
            .then(data => {
                btnCek.disabled = false;
                btnCek.innerText = '🔍 Cari Tanggapan';
                if (data.result === 'success') {
                    cekResult.innerHTML = `
                        <div class="card-result">
                            <span class="badge">Status: ${data.status}</span>
                            <p><strong>Nama:</strong> ${data.nama}</p>
                            <p><strong>Pesan Anda:</strong> ${data.pesan}</p>
                            <hr style="margin:8px 0; border:0; border-top:1px solid #dce9df;">
                            <p><strong>Tanggapan Admin:</strong></p>
                            <p style="color:#1f5c3a; font-weight:600;">${data.tanggapan}</p>
                        </div>
                    `;
                } else {
                    cekResult.innerHTML = `<span style="color:#d64545;">❌ ${data.message}</span>`;
                }
            })
            .catch(err => {
                btnCek.disabled = false;
                btnCek.innerText = '🔍 Cari Tanggapan';
                cekResult.innerHTML = '<span style="color:#d64545;">❌ Terjadi kesalahan koneksi.</span>';
            });
    }
</script>

</body>
</html>
