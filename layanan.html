<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulir Layanan Desa - Desa Matang Labong</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #e8f5eb, #d4ead9);
            color: #294333;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 480px;
            background: #ffffff;
            padding: 30px 25px;
            border-radius: 24px;
            box-shadow: 0 10px 35px rgba(31, 92, 58, 0.15);
            position: relative;
        }
        .btn-close {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #28734b;
            color: white;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: 0.2s;
        }
        .btn-close:hover {
            background: #1f5c3a;
        }
        .header {
            text-align: center;
            margin-bottom: 25px;
            padding-right: 25px;
        }
        .header-icon {
            width: 65px;
            height: 65px;
            background: #e2f1e5;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            margin: 0 auto 12px;
        }
        h2 {
            color: #1f5c3a;
            font-size: 22px;
            margin-bottom: 4px;
        }
        p.subtitle {
            color: #718078;
            font-size: 13px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            color: #365541;
            font-weight: 600;
            font-size: 14px;
        }
        input[type="text"],
        input[type="tel"],
        textarea {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid #dce9df;
            border-radius: 12px;
            font-size: 14px;
            outline: none;
            transition: 0.2s;
        }
        input:focus, textarea:focus {
            border-color: #28734b;
        }
        textarea {
            resize: vertical;
            height: 110px;
        }
        .btn-submit {
            width: 100%;
            padding: 14px;
            background-color: #28734b;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
            transition: 0.2s;
        }
        .btn-submit:hover {
            background-color: #1f5c3a;
        }
        .btn-submit:disabled {
            background-color: #a5c4b1;
            cursor: not-allowed;
        }
        #statusMessage {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
            font-weight: 600;
            line-height: 1.5;
        }
    </style>
</head>
<body>

<div class="container">
    <a href="index.html" class="btn-close" title="Kembali ke Beranda">×</a>
    
    <div class="header">
        <div class="header-icon">🌿</div>
        <h2>Formulir Layanan Desa</h2>
        <p class="subtitle">Desa Matang Labong • Kecamatan Tebas</p>
    </div>

    <form id="layananForm">
        <div class="form-group">
            <label for="nama">Nama Lengkap</label>
            <input type="text" id="nama" name="Nama Lengkap" placeholder="Masukkan nama lengkap Anda" required>
        </div>

        <div class="form-group">
            <label for="wa">Nomor WhatsApp</label>
            <input type="tel" id="wa" name="Nomor WA" placeholder="Contoh: 081234567890" required>
        </div>

        <div class="form-group">
            <label for="dusun">Dusun / RT / RW</label>
            <input type="text" id="dusun" name="Dusun / RT" placeholder="Contoh: Dusun II / RT 03" required>
        </div>

        <div class="form-group">
            <label for="pesan">Keperluan / Pesan</label>
            <textarea id="pesan" name="Keperluan / Pesan" placeholder="Tuliskan keperluan atau pesan Anda di sini..." required></textarea>
        </div>

        <button type="submit" class="btn-submit" id="btnSubmit">📤 Kirim Pesan</button>
    </form>

    <div id="statusMessage"></div>
</div>

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbwgr4g-WVQwf8HYxuxhDxpkgp6jYW81LM5Cw9oMXSf2QU4F2JmHvTqbJeXxjaEWm2EJHQ/exec';
    const form = document.getElementById('layananForm');
    const btnSubmit = document.getElementById('btnSubmit');
    const statusMessage = document.getElementById('statusMessage');

    form.addEventListener('submit', e => {
        e.preventDefault();
        btnSubmit.disabled = true;
        btnSubmit.innerText = '⏳ Mengirim...';
        statusMessage.style.color = '#28734b';
        statusMessage.innerText = 'Proses mengirim pesan...';

        fetch(scriptURL, { method: 'POST', body: new FormData(form) })
            .then(response => response.json())
            .then(data => {
                btnSubmit.disabled = false;
                btnSubmit.innerText = '📤 Kirim Pesan';
                if(data.result === 'success') {
                    statusMessage.style.color = '#27ae60';
                    statusMessage.innerHTML = '✅ Pesan berhasil dikirim!<br><strong>Simpan Token Anda: ' + data.token + '</strong>';
                    form.reset();
                } else {
                    statusMessage.style.color = '#d64545';
                    statusMessage.innerText = '❌ Gagal: ' + data.message;
                }
            })
            .catch(error => {
                btnSubmit.disabled = false;
                btnSubmit.innerText = '📤 Kirim Pesan';
                statusMessage.style.color = '#d64545';
                statusMessage.innerText = '❌ Gagal mengirim pesan. Coba lagi.';
                console.error('Error!', error.message);
            });
    });
</script>

</body>
</html>
